# Baseline config. Override any key from the CLI with --set key.path=value

seed: 0
name: baseline

data:
  jsonl: data/processed/dev.jsonl   # produced by scripts/ingest_dataset.py
  limit: null                       # cap number of samples (null = all)
  toy: false                        # true -> synthetic samples, no video needed
  video_root: data/raw/ovo/src_videos   # where scripts/ovo_tar_remote.py fetch put the videos

video:
  fps: 2.0          # Em-Garde matcher setting: 2 fps
  window_s: 2.0     # 2-second windows
  stride_s: 0.5     # emit a window every 0.5 s

cues:
  n_cues: 3         # parsed once per query by the EDGE model

matcher:
  embedder: random  # random | opsmm
  attn: sdpa        # use sdpa on Windows / consumer GPUs (flash_attention_2 is not available there)
  device: cuda
  stride_s: 0.5     # one matcher step every 0.5 s (Em-Garde: 2 fps processing rate)
  window_s: 2.0     # each step embeds the last 2 s ...
  fps: 2.0          # ... at 2 fps = 4 frames
  min_pixels: null  # null = the wrapper's own minimum (256 visual tokens per frame, as Em-Garde runs); e.g. 7056 = faster, different vectors (D17)
  max_pixels: 78400 # frame area cap, Qwen smart_resize; Em-Garde's matcher uses 280*280 (about 364 x 196 for 16:9)
  cache_dir: results/cache
  model_id: OpenSearch-AI/Ops-MM-embedding-v1-2B
  threshold: 0.04   # Em-Garde default theta (surge in cosine sim, any cue)
  cooldown_s: 0.0

evidence:
  every_s: 5.0      # scene-graph triplets every 5 s
  per_clip: 8
  top_k: 5

edge:
  backend: mock     # mock | hf | api (an OpenAI-compatible endpoint, e.g. OpenRouter: set base_url and api_key_env) | claude
  transport: cli    # only for backend claude: cli = `claude -p` on the logged-in subscription, api = the Anthropic SDK with a key
  effort: low       # only for backend claude: low | medium | high (thinking effort; part of the cache key)
  base_url: https://openrouter.ai/api/v1   # only for backend api
  api_key_env: OPENROUTER_API_KEY          # name of the environment variable that holds the key; the key itself is never stored
  model_id: Qwen/Qwen3-VL-2B-Instruct   # 2B fits an 8 GB GPU in BF16; see docs/RATIONALE.md D16
  device: cuda
  dtype: bfloat16
  quant: null       # null | int8 | int4  (for the Jetson work, not the baseline)
  max_pixels: 200704  # 448*448: caps the tokens each frame costs

cloud:
  backend: mock     # mock | openai  -- only called in the uncertain band
  model: gpt-4o-mini

decider:            # row 1: the edge model asked "respond now?" at fixed ticks (decisions D5, D13)
  variant: query_only   # query_only | query_cues (row 2) | query_evidence (row 5)
  stride_s: 2.0     # one decision every 2 s
  window_s: 2.0     # frames shown: the last 2 s
  fps: 2.0          # 2 fps -> 4 frames per decision
  max_side: 448     # frames resized so the long side is at most this
  cache_dir: results/cache

policy:
  lo: 0.3           # p_speak <= lo -> silent
  hi: 0.7           # p_speak >= hi -> edge answers; in between -> cloud

eval:
  tol_s: 2.0        # correct if within +/- tol of an event (Em-Garde uses 2)
  calib_bins: 10

output:
  dir: results
